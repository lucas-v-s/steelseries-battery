name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/steelseries-battery.exe -DestinationPath steelseries-battery-windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: steelseries-battery-windows.zip
